services:
  - type: web
    name: trishul-vani-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: TRISHUL_PUBLIC_HOSTING
        value: "1"
      - key: TRISHUL_HOST_DATA
        value: /tmp/trishul
  - type: web
    name: trishul-vani-frontend
    runtime: static
    branch: main
    rootDir: web
    buildCommand: echo ready
    staticPublishPath: .
    autoDeployTrigger: checksPass
