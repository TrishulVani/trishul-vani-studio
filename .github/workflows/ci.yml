name: Verify software
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: DSP + API + Benchmarks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Test complete software pipeline
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --version
          node --check web/app.js
          node --check web/studio.js
          node --check web/design-v2.js
          node --check web/experience.js
          node --check web/arrival-v2.js
          node --check web/relaunch-v2.js
          node --check web/flyover-v2.js
          node --check web/journey-v2.js
          node --check web/atmosphere-v4.js
          node --check web/brand-v2.js
          node --check web/tour.js
          test -s web/tour.css
          test -s docs/TUTORIAL_STORYBOARD.md
          node tests/dsp-core.test.cjs
      - name: Verify Design 02 assets
        run: |
          test -s web/design-v2.css
          test -s web/design-v2.js
          test -s web/experience.html
          test -s web/experience.css
          test -s web/trident.svg
          test -s web/mark-v2.svg
          test -s web/assets/signal-chamber-v2.png
          test -s web/assets/signal-operator-v2.png
          test -s web/assets/b2-flyover-v2.webp
          test -s web/flyover-v2.css
          test -s web/journey-v2.css
          test -s web/intro-v2.css
          test -s web/brand-v2.css
          test -s web/brand-v2.js
          test -s web/atmosphere-v4.css
          test -s web/assets/operator-b2-journey-v2.png
          test -s web/assets/operator-signal-passage-v2.png
          test -s web/assets/signal-corridor-plate-v2.png
          test -s web/assets/operator-flight-cutout-v2.png
          test -s web/assets/preview-trident-v2.webp
          test -s web/assets/brand-glyph-v2.png
          test -s web/assets/signal-microphones-v2.webp
          test -s deploy/pages/design-v2/index.html
          test -s deploy/pages/design-v2/mark.svg
          test -s deploy/pages/design-v2/signal-microphones-v2.webp
          grep -q 'arrival-v2.js' web/index.html
          grep -q 'design-v2.css' web/lab.html
          grep -q 'design-v2.css' web/studio.html
          grep -q 'trishul-vani-frontend.onrender.com' deploy/pages/index.html
          grep -q 'location.replace' deploy/pages/index.html
          grep -q 'trishul-vani-frontend.onrender.com/design-v2/' deploy/pages/design-v2/index.html
          grep -q 'location.replace' deploy/pages/design-v2/index.html
      - name: Verify artifacts are excluded
        run: |
          git check-ignore artifacts/secret-test.wav
          git check-ignore local-not-for-commit.wav
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t trishul-vani:ci .
  browser:
    name: Connected browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chrome
      - name: Run desktop tablet and mobile journeys
        run: pnpm exec playwright test --workers=2
