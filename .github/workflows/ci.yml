name: Verify software
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: DSP + API + Benchmarks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Test complete software pipeline
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --version
          node --check web/app.js
          node --check web/studio.js
          node --check web/design-v2.js
          node tests/dsp-core.test.cjs
      - name: Verify Design 02 assets
        run: |
          test -s web/design-v2.css
          test -s web/design-v2.js
          test -s web/trident.svg
          test -s web/trident-v2.svg
          test -s web/assets/signal-microphones-v2.webp
          test -s deploy/pages/design-v2/index.html
          test -s deploy/pages/design-v2/trident.svg
          grep -q 'design-v2.css' web/index.html
          grep -q 'design-v2.css' web/studio.html
          grep -q 'design=2' deploy/pages/design-v2/index.html
      - name: Verify artifacts are excluded
        run: |
          git check-ignore artifacts/secret-test.wav
          git check-ignore local-not-for-commit.wav
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t trishul-vani:ci .
